# Original Work: https://github.com/Azure-Samples/terraform-github-actions/blob/main/.github/workflows/tf-plan-apply.yml

name: '[Reusable] Terraform Apply'

on:
  workflow_call:
    inputs:
      ACT_MODE:
        description: |
          For running Github Action Workflows locally with Nektos act
        required: true
        type: boolean
      TF_PLAN_PATH:
        description: |
          Terraform Plan Artifact Path
        required: false
        type: string
        default: ''
      TF_PLAN_NAME:
        description: |
          Terraform Plan Artifact Name 
        required: false
        type: string
        default: ''
      mask:
        description: |
          Flag to mask environment variables
        required: false
        type: boolean
        default: true
      working_directory:
        description: |
          Working directory containing Terraform test scripts.
        required: false
        type: string
        default: "./test"

    secrets:
      backend_config:
        description: 'Optional Terraform backend configuration in HCL format'
        required: false
      env_variables:
        description: |
          Passing ENV Variables from parent level workflow to reusable workflow
          https://github.com/orgs/community/discussions/26671#discussioncomment-6776498

          Possible ENV Variables include
          secrets:
            env_variables:
              TF_VAR_WIF_ID="$\{{ github.run_id}}-$\{{github.run_attempt}}"
              TF_VAR_GITHUB_REPOSITORY_OWNER="$\{{ github.repository_owner }}"
              TF_VAR_GITHUB_REPOSITORY="$\{{ github.repository }}"
              TF_VAR_GITHUB_REF="$\{{ github.ref }}"
              TF_VAR_GITHUB_ENV=production

        required: false
      AZURE_CLIENT_ID:
        description: |
          Azure Service Account Client ID for authentication
        required: true
      AZURE_CLIENT_SECRET:
        description: |
          Azure Service Account Client Secret for Authentication when running locally.
          Takes precedence over certificate-based authentication when provided.
        required: false
      AZURE_CLIENT_CERTIFICATE_PATH:
        description: |
          Azure Service Account Client Certificate path for certificate-based authentication when running locally.
          Used only when AZURE_CLIENT_SECRET is not provided.
        required: false
      AZURE_CLIENT_CERTIFICATE_PASSWORD:
        description: |
          Azure Service Account Client Certificate password for certificate-based authentication when running locally.
          Used only when AZURE_CLIENT_SECRET is not provided.
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: |
          Azure Subscription ID
        required: true
      AZURE_TENANT_ID:
        description: |
          Azure Tenant ID
        required: true
      TF_API_TOKEN:
        description: |
          Terraform.io Access Token
        required: true

#Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read

#These environment variables are used by the terraform azure provider to setup OIDD authenticate. 
env:
    ARM_USE_OIDC: "${{ !!inputs.ACT_MODE  && 'false' || 'true' }}"
    ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
    ARM_CLIENT_SECRET: "${{ !!inputs.ACT_MODE && secrets.AZURE_CLIENT_SECRET || '' }}"
    ARM_CLIENT_CERTIFICATE_PATH: "${{ !!inputs.ACT_MODE && secrets.AZURE_CLIENT_SECRET == '' && secrets.AZURE_CLIENT_CERTIFICATE_PATH || '' }}"
    ARM_CLIENT_CERTIFICATE_PASSWORD: "${{ !!inputs.ACT_MODE && secrets.AZURE_CLIENT_SECRET == '' && secrets.AZURE_CLIENT_CERTIFICATE_PASSWORD || '' }}"
    ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
    ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"

jobs:
  reusable-integration-apply:
    name: 'Terraform Apply'
    environment: production
    runs-on: ubuntu-latest
    
    defaults:
        run:
          working-directory: "${{ inputs.working_directory }}"

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Decode Environment Variables
      env:
        env_vars: ${{ secrets.env_variables }}
      run: |
        for i in $env_vars; do
          i=$(echo $i | sed 's/=.*//g')=$(echo ${i#*=} | base64 -di | base64 -di)
          if ${{ inputs.mask }}
          then
            echo ::add-mask::${i#*=}
          fi
          printf '%s\n' "$i" >> $GITHUB_ENV
        done

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
        terraform_wrapper: false

    - name: Terraform Init
      shell: bash
      env:
        TF_BACKEND_CONFIG: ${{ secrets.backend_config }}
      run: |
        if [ -n "$TF_BACKEND_CONFIG" ]; then
          umask 077
          backend_file=$(mktemp "$RUNNER_TEMP/terraform-backend.XXXXXX")
          trap 'rm -f "$backend_file"' EXIT
          printf '%s' "$TF_BACKEND_CONFIG" > "$backend_file"
          terraform init -input=false -backend-config="$backend_file"
        else
          terraform init
        fi

    # Download saved plan from artifacts  
    - name: Download Terraform Plan
      id: tf-plan-download
      if: ${{ inputs.TF_PLAN_NAME != '' && inputs.TF_PLAN_PATH != '' }}
      uses: actions/download-artifact@v3
      with:
        name: ${{ inputs.TF_PLAN_NAME }}
        path: ${{ inputs.TF_PLAN_PATH }}

    # Terraform Apply
    - name: Terraform Apply
      run: |
        if ${{ inputs.TF_PLAN_NAME != '' && inputs.TF_PLAN_PATH != '' }}
        then
          terraform apply -auto-approve ${{ steps.tf-plan-download.outputs.download-path }}/${{ inputs.TF_PLAN_NAME }}
        else
          terraform apply -auto-approve
        fi
